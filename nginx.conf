server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' https://api.open-meteo.com https://api.rss2json.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.googleapis.com; img-src 'self' data: https://*.gstatic.com https://translate.google.com https://*.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline' https://*.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://translate.google.com https://translate.googleapis.com https://*.googleapis.com https://*.gstatic.com; frame-src 'self' https://translate.google.com;" always;

    location / {
        try_files $uri $uri/ /index.html;
        # HTML cache
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' https://api.open-meteo.com https://api.rss2json.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.googleapis.com; img-src 'self' data: https://*.gstatic.com https://translate.google.com https://*.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline' https://*.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://translate.google.com https://translate.googleapis.com https://*.googleapis.com https://*.gstatic.com; frame-src 'self' https://translate.google.com;" always;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' https://api.open-meteo.com https://api.rss2json.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.googleapis.com; img-src 'self' data: https://*.gstatic.com https://translate.google.com https://*.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline' https://*.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://translate.google.com https://translate.googleapis.com https://*.googleapis.com https://*.gstatic.com; frame-src 'self' https://translate.google.com;" always;
    }
}
